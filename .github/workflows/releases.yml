name: Publish package to GitHub Packages
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: roaring
          fetch-depth: 0  # Fetch full history for Spotless ratchetFrom to work
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build with Gradle
        run: ./gradlew build -x test -x spotlessJava -x spotlessCheck -x spotlessApply -i
        working-directory: ./roaring
      - name: Publish to GitHub Packages
        run: ./gradlew publishSonatypePublicationToGitHubPackagesRepository -i
        working-directory: ./roaring
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug PGP Key
        run: |
          echo "GPG_SIGNING_KEY length: ${GPG_SIGNING_KEY}"
          echo "Key starts with: $(echo "$GPG_SIGNING_KEY" | head -c 50)"
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      - name: Publish to Maven Central
        run: ./gradlew publishSonatypePublicationToCentralPortalRepository -i --stacktrace --debug
        working-directory: ./roaring
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
    
