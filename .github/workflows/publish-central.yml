name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without actually publishing)'
        required: true
        default: 'true'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Verify build works
        run: ./gradlew build publishToMavenLocal -x test
      
      - name: List artifacts that will be published
        run: |
          echo "Generated artifacts:"
          find . -name "*.jar" -path "*/build/libs/*"
          echo ""
          echo "Generated POMs:"
          find . -name "*.pom" -path "*/build/publications/*"
      
      - name: Publish to Central Portal (DRY RUN)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Would publish with these commands:"
          echo "./gradlew roaringbitmap:publishMavenPublicationToCentralPortalRepository"
          echo "./gradlew bsi:publishMavenPublicationToCentralPortalRepository"
          echo ""
          echo "Artifacts that would be published:"
          find . -name "*.jar" -path "*/build/libs/*" -exec basename {} \;
          echo ""
          echo "Using credentials: MAVEN_CENTRAL_USERNAME = ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && 'SET' || 'NOT SET' }}"
          echo "Using credentials: MAVEN_CENTRAL_PASSWORD = ${{ secrets.MAVEN_CENTRAL_PASSWORD != '' && 'SET' || 'NOT SET' }}"
      
      - name: Publish to Central Portal (REAL)
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "=== PUBLISHING TO MAVEN CENTRAL ==="
          ./gradlew roaringbitmap:publishMavenPublicationToCentralPortalRepository bsi:publishMavenPublicationToCentralPortalRepository -i --no-daemon
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      
      - name: Upload artifacts for verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-artifacts
          path: |
            **/build/libs/*.jar
            **/build/publications/maven/*.pom
          retention-days: 30