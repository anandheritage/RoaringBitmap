name: Publish to Maven Central

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      publish_type:
        description: 'Publishing type'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - production
  push:
    branches:
      - master
      - 'anandsh/*'  # Allow publishing from feature branches
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for Spotless
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Test local publishing first
        run: ./gradlew publishToMavenLocal -i
        
      - name: Publish to Central Portal (Test Mode)
        if: github.event.inputs.publish_type == 'test' || github.ref_name != 'master'
        run: |
          echo "Publishing in test mode from branch: ${{ github.ref_name }}"
          ./gradlew roaringbitmap:publishMavenPublicationToCentralPortalRepository bsi:publishMavenPublicationToCentralPortalRepository -i
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      
      - name: Publish to Central Portal (Production Mode)
        if: github.event.inputs.publish_type == 'production' && github.ref_name == 'master'
        run: |
          echo "Publishing in production mode from master branch"
          ./gradlew roaringbitmap:publishMavenPublicationToCentralPortalRepository bsi:publishMavenPublicationToCentralPortalRepository -i
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            **/build/publications/maven/*.pom
          retention-days: 7